  sowDirect: { value: { from: 19, to: 23 }, estimate: true, source: "from: Jardiner Malin, calendrier par climat (Aquitaine et Poitou-Charentes, semi-oceanique), https://www.jardiner-malin.fr/fiche/calendrier-semis-recolte-potager.html. to: calendrier CIVAM/ARS Auvergne-Rhone-Alpes, non regional" }
  # Le livret donne mai-aout ; avec une base de 12.8 C, les nuits de septembre n'apportent presque plus de chaleur.
  transplant: { value: { from: 19, to: 27 }, estimate: true, source: "from: Jardiner Malin, calendrier par climat (Aquitaine et Poitou-Charentes, semi-oceanique), https://www.jardiner-malin.fr/fiche/calendrier-semis-recolte-potager.html (concombres des debut mai) et Jardiner Malin, fiche culture, https://www.jardiner-malin.fr/fiche/culture-concombre.html ('Repiquez en pleine terre pas avant le mois de mai car les risques de gelee subsistent encore'). to: estimation, revue agronomique du 2026-10-20 (fin juin = S27, aucune source lue ne donne de date de fin)" }
  tBaseC: { value: 12.8, source: "Purdue MRCC (Tbase en F converti en C), https://mrcc.purdue.edu/resources/growing-degree-day-description", estimate: true }
  daysToMaturity: { value: 105, source: "FAO-56 tableau 11, ligne Cucumber, June/Aug, Arid Region, https://www.fao.org/4/x0490e/x0490e0b.htm", estimate: true }
  # Deux delais : depuis le semis en place, et depuis la plantation d'un plant (godet ou achete).
  # Le delai depuis la plantation retire 4 semaines d'elevage en godet, la borne basse donnee pour la courgette par Jardiner Malin.
  firstHarvestDays: { value: [{ days: 60, from: sowing }, { days: 32, from: transplant }], source: "sowing: Truffaut, fiche produit Vilmorin, https://www.truffaut.com/sachet-graines-de-concombre-breso-hf1.html (Breso HF1 : '60 jours du semis à la récolte'). transplant: 60 jours moins 4 semaines d'elevage, Jardiner Malin, https://www.jardiner-malin.fr/fiche/courgette.html ('repiquez en pleine terre 4 à 6 semaines plus tard')", estimate: true }
  spacingCm: { value: { inRow: 50, betweenRows: 100 }, estimate: true }
  kc: { value: { initial: 0.6, mid: 1.0, late: 0.75 }, source: "FAO-56 tableau 12 via jeux de donnees du paquet R FAO56 1.0, https://cran.r-project.org/src/contrib/FAO56_1.0.tar.gz", estimate: true }
  frostSensitive: true
  goodCompanions: [basilic, haricot]
  badCompanions: [pomme-de-terre]
  seedLifespanYears: { value: 8, source: "Alsagarden, tableau 'Duree de conservation et germination des graines potageres', https://www.alsagarden.com/blog/duree-de-conservation-et-germination-des-graines-potageres/ (Concombre, 8 a 10 ans, borne basse)", estimate: true }
  maturitySigns: "Fruit ferme et vert foncé, récolte avant que les graines gonflent."

